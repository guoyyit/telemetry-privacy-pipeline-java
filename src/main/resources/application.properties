server.port=0

# ===== 隐私采集与合规导出管道配置（前缀 pipeline）=====
# 持久化日志与审计文件目录（events.log/deletions.log/rollback.log/audit.log）
pipeline.data-dir=${java.io.tmpdir}/telemetry-pipeline
# 默认保留期（天），超过保留期的事件经保留期清除后从所有视图消失
pipeline.retention-days=90
# 聚合导出最小分组规模：计数小于该值的分组被抑制或合并
pipeline.min-group-size=5
# 被抑制的小分组是否确定性地合并为 __other__（false=直接抑制）
pipeline.merge-suppressed-groups=true
# 允许采集的事件类型白名单（留空表示允许全部类型）
pipeline.allowed-event-types[0]=page_view
pipeline.allowed-event-types[1]=click
pipeline.allowed-event-types[2]=performance
# 字段级规则：KEEP 保留 / MASK 掩码 / HASH SHA-256 摘要 / DROP 删除
pipeline.field-rules.email=HASH
pipeline.field-rules.phone=MASK
pipeline.field-rules.id_card=DROP
pipeline.field-rules.content=KEEP
# 无论脱敏配置如何都禁止进入存储的字段；命中即整事件拒绝（DENY_RULE）
pipeline.denied-fields[0]=health_data
pipeline.denied-fields[1]=payment_token
